name: Test Research to Code

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python test dependency
        run: python -m pip install --upgrade pip pytest
      - name: Run complete test suite (fail on any failure)
        run: node tests/run-all.cjs
      - name: Run sample pytest suite
        run: python -m pytest -q samples/ewma-anomaly-detection/test_solution.py
